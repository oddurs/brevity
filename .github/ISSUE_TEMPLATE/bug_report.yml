name: Bug report
description: Something does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste an API key. `brevity --config` redacts it for you.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy this text: ...
        2. Run `brevity --print`
        3. ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Output of `brevity --config`
      description: Paste it as-is. The API key is already redacted.
      render: text
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux (Wayland)
        - Linux (X11)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `brevity --version`, or the commit you built.
      placeholder: brevity 0.1.0
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Error output, the hotkey tool you launch it from, whether it works when
        run from a terminal but not from the hotkey.
